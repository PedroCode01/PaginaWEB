<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Tela de Cadastro</title>
</head>
<body>
    <div class= "container mt-5">
        <div class="row justify-content-center">
            <form action="{% url 'cadastro' %}" method="POST">
                {% csrf_token %}
                <div class="mb-3 input-name">
                    <label for="nome" class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="username" name="nome" required>
                </div>
                <div class="mb-3 input-email">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="usermail" name="email" required>
                </div>
                <div class="mb-3 input-password">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="userpassword" name="senha" required>
                </div>
                <div class="d-grid register-button">
                    <button type="submit" class="btn btn-primary register-b">Cadastrar</button>
                </div>   
            </form>
        </div>

    </div>
</body>
</html>
